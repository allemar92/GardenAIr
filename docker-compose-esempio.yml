version: "3.9"

services:
  llm-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.llm
    container_name: llm-server
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}   # usa variabili d'ambiente dal tuo .env
    ports:
      - "4000:4000"
    restart: unless-stopped

  api-server:
    build: 
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: api-server
    ports:
      - "8000:8000"
    depends_on:
      - llm-server
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: frontend
    ports:
      - "7860:7860"
    depends_on:
      - api-server
    restart: unless-stopped
