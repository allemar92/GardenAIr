version: "3.9"

services:
  backend:
    build: .
    container_name: gardenair-backend
    command: uvicorn src.api.main_api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs
    networks:
      - gardenair_net
    restart: unless-stopped

  frontend:
    build: .
    container_name: gardenair-frontend
    command: python -m src.frontend.gradio_app
    ports:
      - "7860:7860"
    env_file:
      - .env
    environment:
      - API_URL=http://backend:8000
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs
    depends_on:
      - backend
    networks:
      - gardenair_net
    restart: unless-stopped

networks:
  gardenair_net:
    driver: bridge
